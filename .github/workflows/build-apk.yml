name: Build FiberKar Android APK

on:
  workflow_dispatch: # اجرای دستی از تب Actions
  push:
    tags:
      - "v*"

permissions:
  contents: write # برای انتشار در Releases

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # خروجی استاتیک Next.js برای WebView اندروید
      - name: Build static web app
        env:
          CAP_EXPORT: "1"
        run: |
          bun run build

      - name: Setup Capacitor
        run: |
          bunx cap init fiberkar app.fiberkar --web-dir out --yes
          bun add -d @capacitor/cli
          bun add @capacitor/core @capacitor/android

      - name: Add Android platform
        run: bunx cap add android

      - name: Configure Android app (app name)
        run: |
          sed -i 's/<string name="app_name">[^<]*/<string name="app_name">فیبرکار/' android/app/src/main/res/values/strings.xml || true

      - name: Sync web assets into Android
        run: bunx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiberkar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiberkar-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
