# Project-wide Gradle settings.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Memory tuned for constrained CI / sandbox environments (2-4 GB RAM).
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx900m

# Single-threaded build keeps memory usage low on 2-core machines.
org.gradle.parallel=false
org.gradle.workers.max=2

# AndroidX package structure to make it clearer which packages are bundled with
# the app's APK.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
